name: New source
description: Suggest a board to add
labels: [source]
body:
  - type: input
    id: name
    attributes: { label: Source, placeholder: "Lobsters, Product Hunt, a specific blog…" }
    validations: { required: true }
  - type: input
    id: endpoint
    attributes:
      label: How to fetch it
      description: An API endpoint or RSS URL, if you know one. If it only has a web page, say so.
  - type: textarea
    id: why
    attributes: { label: Why it belongs here }
